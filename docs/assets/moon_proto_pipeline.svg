<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img">
<defs>
  <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="45%" stop-color="#f5f3ff"/>
    <stop offset="100%" stop-color="#ecfeff"/>
  </linearGradient>
  <linearGradient id="terminal" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
  <style>
  .bg { fill: #f8fafc; }
  .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1.2; }
  .title { fill: #0f172a; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .subtitle { fill: #475569; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .label { fill: #0f172a; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .small { fill: #475569; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { fill: #d1fae5; font: 500 14px "SFMono-Regular", Consolas, monospace; }
  .mono-dim { fill: #94a3b8; font: 500 13px "SFMono-Regular", Consolas, monospace; }
  .ok { fill: #10b981; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .warn { fill: #f97316; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bad { fill: #ef4444; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .chip { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1; }
  .chipText { fill: #0e7490; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .arrow { stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
</style>
  
</defs>
<rect class="bg" width="100%" height="100%" rx="28"/>
<rect x="16" y="16" width="1148" height="488" rx="26" fill="url(#hero)" stroke="#dbe4f0"/>
<text x="56" y="70" class="title">Moon Proto Lab: .proto 到可验收报告的闭环</text>
<text x="58" y="100" class="subtitle">把 AI 生成的 schema 变成可诊断、可编译、可回归、可长期维护的 MoonBit 工程资产。</text>
<rect x="955" y="48" width="170" height="36" rx="18" class="chip"/>
<text x="1040" y="72" class="chipText" text-anchor="middle">CI PASS · 60/60</text>
<rect x="60" y="160" width="175" height="210" rx="18" class="panel"/>
<rect x="60" y="160" width="175" height="8" rx="4" fill="#6366f1"/>
<text x="80" y="202" class="label">1. AI / 手写 .proto</text>
<text x="80" y="232" class="small">good_order.proto</text>
<text x="80" y="254" class="small">bad_order.proto</text>
<text x="80" y="276" class="small">schema v1 / v2</text>
<rect x="285" y="160" width="175" height="210" rx="18" class="panel"/>
<rect x="285" y="160" width="175" height="8" rx="4" fill="#0ea5e9"/>
<text x="305" y="202" class="label">2. Schema Doctor</text>
<text x="305" y="232" class="small">语法 + 结构诊断</text>
<text x="305" y="254" class="small">reserved 合同检查</text>
<text x="305" y="276" class="small">enum / map / oneof 规则</text>
<rect x="510" y="160" width="175" height="210" rx="18" class="panel"/>
<rect x="510" y="160" width="175" height="8" rx="4" fill="#14b8a6"/>
<text x="530" y="202" class="label">3. 兼容性检查</text>
<text x="530" y="232" class="small">字段号不能乱改</text>
<text x="530" y="254" class="small">删除字段必须 reserved</text>
<text x="530" y="276" class="small">v1 -&gt; v2 可回归</text>
<rect x="735" y="160" width="175" height="210" rx="18" class="panel"/>
<rect x="735" y="160" width="175" height="8" rx="4" fill="#22c55e"/>
<text x="755" y="202" class="label">4. MoonBit Codegen</text>
<text x="755" y="232" class="small">生成 structs / enums</text>
<text x="755" y="254" class="small">descriptor registry</text>
<text x="755" y="276" class="small">helper functions</text>
<rect x="960" y="160" width="175" height="210" rx="18" class="panel"/>
<rect x="960" y="160" width="175" height="8" rx="4" fill="#f97316"/>
<text x="980" y="202" class="label">5. CI + 报告</text>
<text x="980" y="232" class="small">moon check / test</text>
<text x="980" y="254" class="small">JUnit / Markdown</text>
<text x="980" y="276" class="small">评审可复现证据</text>
<path d="M238 265 C262 265 262 265 283 265" class="arrow"/>
<path d="M463 265 C487 265 487 265 508 265" class="arrow"/>
<path d="M688 265 C712 265 712 265 733 265" class="arrow"/>
<path d="M913 265 C937 265 937 265 958 265" class="arrow"/>
<rect x="60" y="420" width="1065" height="58" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
<text x="82" y="455" class="label">Reviewer signal:</text>
<text x="225" y="455" class="subtitle">不是单点库，而是 schema → codegen → compile → report → CI 的可复现产品闭环。</text>
</svg>
