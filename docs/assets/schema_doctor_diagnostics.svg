<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img">
<defs>
  <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="45%" stop-color="#f5f3ff"/>
    <stop offset="100%" stop-color="#ecfeff"/>
  </linearGradient>
  <linearGradient id="terminal" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
  <style>
  .bg { fill: #f8fafc; }
  .panel { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1.2; }
  .title { fill: #0f172a; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .subtitle { fill: #475569; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .label { fill: #0f172a; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .small { fill: #475569; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mono { fill: #d1fae5; font: 500 14px "SFMono-Regular", Consolas, monospace; }
  .mono-dim { fill: #94a3b8; font: 500 13px "SFMono-Regular", Consolas, monospace; }
  .ok { fill: #10b981; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .warn { fill: #f97316; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bad { fill: #ef4444; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .chip { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1; }
  .chipText { fill: #0e7490; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .arrow { stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
</style>
  
</defs>
<rect class="bg" width="100%" height="100%" rx="28"/>
<rect x="16" y="16" width="1148" height="488" rx="26" fill="url(#hero)" stroke="#dbe4f0"/>
<text x="56" y="68" class="title">Schema Doctor: AI 反例稳定诊断</text>
<text x="58" y="98" class="subtitle">bad_order.proto 模拟 AI 常见错误：重复字段号、reserved 复用、enum 不合法、map key 类型错误。</text>
<rect x="56" y="130" width="1068" height="340" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
<rect x="56" y="130" width="1068" height="54" rx="18" fill="#fee2e2"/>
<text x="86" y="164" class="label">python3 scripts/moon_proto_lab.py doctor examples/ai/bad_order.proto</text>
<text x="1000" y="164" class="bad">FAIL expected</text>
<text x="88" y="220" class="bad">✕</text>
<text x="118" y="220" class="bad">schema invalid</text>
<text x="88" y="249" class="subtitle">•</text>
<text x="118" y="249" class="small">issues: 6</text>
<text x="88" y="278" class="subtitle">•</text>
<text x="118" y="278" class="small">message.Order.field.1: duplicate field number</text>
<text x="88" y="307" class="subtitle">•</text>
<text x="118" y="307" class="small">message.Order.field.invalid_labels.key: invalid map key type</text>
<text x="88" y="336" class="subtitle">•</text>
<text x="118" y="336" class="small">message.Order.field.legacy_note.number: field uses reserved number</text>
<text x="88" y="365" class="subtitle">•</text>
<text x="118" y="365" class="small">message.Order.field.legacy_note.name: field uses reserved name</text>
<text x="88" y="394" class="subtitle">•</text>
<text x="118" y="394" class="small">enum.OrderStatus.values[0]: proto3 enum first value must be zero</text>
<text x="88" y="423" class="subtitle">•</text>
<text x="118" y="423" class="small">enum.OrderStatus.value.1: duplicate enum value number</text>
<rect x="720" y="230" width="330" height="170" rx="18" fill="#f8fafc" stroke="#dbe4f0"/>
<text x="745" y="265" class="label">评审可见价值</text>
<text x="745" y="300" class="small">AI 生成内容不是直接相信</text>
<text x="745" y="328" class="small">先诊断，再生成，再编译</text>
<text x="745" y="356" class="small">问题可定位、可回归、可报告</text>
</svg>
