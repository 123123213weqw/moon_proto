syntax = "proto3";
package demo.ai;

// Compatible evolution of good_order.proto: existing field numbers/names/types
// are preserved and only new fields/enum values are appended.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message Money {
  uint64 cents = 1;
  string currency = 2;
}

message Order {
  uint64 order_id = 1;
  string buyer_id = 2;
  OrderStatus status = 3;
  repeated string item_skus = 4;
  map<string, uint64> attributes = 5;
  Money total = 6;

  oneof contact {
    string email = 7;
    string phone = 8;
  }

  string trace_id = 9;
}
