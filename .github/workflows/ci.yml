name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python oracle dependencies
        run: python3 -m pip install --user 'protobuf==3.20.3'
      - name: Python protobuf oracle fixtures
        run: python3 tests/oracle/python_protobuf_oracle.py
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: tests/oracle/go.sum
      - name: Go protobuf oracle fixtures
        run: cd tests/oracle && go run .
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit version
        run: moon version
      - name: Update MoonBit registry index
        run: moon update
      - name: Format check
        run: moon fmt --check
      - name: Public interface check
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti
      - name: Package metadata check
        run: moon package
      - name: Check
        run: moon check
      - name: Build
        run: moon build
      - name: Test
        run: moon test
      - name: Test all targets
        run: moon test --target all
      - name: CLI smoke
        run: moon run cmd/main -- gen --example
      - name: Generated code compile check
        run: tests/codegen/compile_generated.sh
      - name: AI schema verification smoke
        run: |
          python3 scripts/moon_proto_lab.py verify \
            examples/ai/good_order.proto \
            --report generated/ai_good_order_verify_report.md \
            --junit-out generated/ai_good_order_verify_report.xml
          python3 scripts/moon_proto_lab.py compat \
            examples/ai/good_order.proto \
            examples/ai/good_order_v2.proto \
            --report generated/ai_good_order_compat_report.md \
            --junit-out generated/ai_good_order_compat_report.xml
          if python3 scripts/moon_proto_lab.py doctor examples/ai/bad_order.proto; then
            echo "bad_order.proto should be rejected" >&2
            exit 1
          fi
      - name: Official differential source contract
        run: |
          git clone --depth 1 https://github.com/moonbitlang/protoc-gen-mbt.git /tmp/protoc-gen-mbt
          python3 scripts/moon_proto_official_diff.py \
            --official-repo /tmp/protoc-gen-mbt \
            --require-official \
            --report generated/official_source_diff_report.md \
            --junit-out generated/official_source_diff_report.xml
          grep -q '<testsuite' generated/official_source_diff_report.xml
          grep -q 'failures="0"' generated/official_source_diff_report.xml
